name: abaplint

on:
  push:
  pull_request:

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run abaplint in ABAP Cloud mode
        run: npx @abaplint/cli@latest abaplint.json
