name: ABAP Unit Testing

on:
  push:
  pull_request:

jobs:
  unit:
    name: Transpile and run ABAP Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain, open-abap-core and open-abap-xco
        run: npm ci

      - name: Transpile ABAP to JavaScript
        run: npm run transpile

      - name: Run ABAP Unit tests
        run: npm run unit
