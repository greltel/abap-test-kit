name: unit tests

# Runs the ABAP Unit tests off-stack: the sources are transpiled to JavaScript with the
# abaplint transpiler and executed on Node.js against open-abap-core and open-abap-xco,
# which npm ci installs. See "Off-stack unit tests" in CONTRIBUTING.md.

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install toolchain, open-abap-core and open-abap-xco
        run: npm ci

      - name: Transpile ABAP to JavaScript
        run: npm run transpile

      - name: Run ABAP Unit tests
        run: npm run unit
